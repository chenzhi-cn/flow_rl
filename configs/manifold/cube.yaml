# Independent manifold configuration (not a training configuration).
# Run prepare once. All subsequent model comparisons read the same NPZ.
samples: runs/manifold_cube/samples.npz
source:
  target: flow_rl.manifold.rollout:OGBenchRolloutAdapter
  kwargs:
    dataset_name: cube-single-play-singletask-task2-v0
    dataset_dir: data/ogbench
    seed: 0
preparation:
  n_critical: 100
  perturbations_per_state: 64
  window_before: 8
  window_after: 8
  noise_scale: 0.1
  seed: 0
  chunk_size: 4
  neighbors: 8
  observation_metric: raw
  action_metric: raw
  svd_rcond: 0.000001
  query_batch_size: 64
  reference_batch_size: 8192
comparison:
  # Existing short-run checkpoints: verify the tool, not architecture quality.
  # Replace these paths with fully trained models for a scientific comparison.
  checkpoints:
    mlp: runs/verify_mlp_matched_20261015/checkpoint.pt
    diffusion: runs/verify_diffusion_matched_20261015/checkpoint.pt
  output_dir: runs/manifold_cube/comparison
  device: cpu
  batch_size: 256
  deterministic: true
  seed: 0
